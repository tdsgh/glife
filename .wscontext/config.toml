[redaction]
extra_patterns = []

[retention]
raw_days = 180

[sync]
# remote is unset by default: nothing is pushed until a Git remote name is set (ctx sync --setup)
fetch_throttle_seconds = 300

[hooks]
time_budget_ms = 2000

[capture]
precompact_snapshot = false
stale_session_minutes = 120
tool_result_max_chars = 0

[logs]
max_bytes = 1048576

[retrieval]
enabled = true
brief = true

[store]
session_warn_bytes = 10485760
store_warn_bytes = 1073741824

[graph]
languages = ["python", "typescript", "javascript"]
exclude = []
query_budget_ms = 5000
cochange_commits = 2000
